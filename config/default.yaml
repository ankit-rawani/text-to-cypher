# Text2Cypher pipeline configuration (spec section 6).
# ${VAR} / ${VAR:-default} tokens are interpolated from the environment at load.

llm:
  endpoint: ${LLM_ENDPOINT:-}          # OpenAI-compatible /chat/completions base URL
  model: ${LLM_MODEL:-}
  api_key: ${LLM_API_KEY:-}
  temperature: 0.0
  max_tokens: 1024
  timeout_s: 60

arcadedb:
  url: ${ARCADE_URL:-}
  database: ${ARCADE_DB:-concept_graph}
  user_readonly: ${ARCADE_RO_USER:-}   # separate read-only credential — required
  password_readonly: ${ARCADE_RO_PASSWORD:-}
  timeout_s: 15
  require_readonly_user: true

qdrant:
  url: ${QDRANT_URL:-}
  api_key: ${QDRANT_API_KEY:-}
  node_collection: concepts
  example_collection: t2c_examples
  timeout_s: 15

mongodb:
  url: ${MONGO_URL:-}
  database: ${MONGO_DB:-}
  collection: ${MONGO_COLLECTION:-}
  enabled: false

embeddings:
  provider: ${EMBED_PROVIDER:-hashing}  # "openai" or "hashing" (offline)
  endpoint: ${EMBED_ENDPOINT:-}
  model: ${EMBED_MODEL:-}
  api_key: ${EMBED_API_KEY:-}
  dim: 256
  timeout_s: 30

grounding:
  sim_threshold: 0.55
  max_candidates: 3
  low_confidence_threshold: 0.65
  enabled: true

examples:
  top_k: 3
  sim_threshold: 0.60
  enabled: true
  seed_path: examples/seed_examples.jsonl

schema_cache:
  ttl_s: 300

dialect:
  denylist_path: config/arcade_denylist.yaml

# User-configured graph schema (node/edge kinds, statuses, attributes).
graph_config_path: config/graph_config.yaml

pipeline:
  max_attempts: 3
  hard_max_attempts: 5
  row_cap: 200
  allow_relaxation: true
