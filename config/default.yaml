# Text2Cypher pipeline configuration (spec section 6).
# ${VAR} / ${VAR:-default} tokens are interpolated from the environment at load.

llm:
  provider: ${LLM_PROVIDER:-openai}    # "openai" (OpenAI-compatible) or "anthropic" (Claude Messages API)
  endpoint: ${LLM_ENDPOINT:-}          # base URL. openai: .../v1 ; anthropic: https://api.anthropic.com
  model: ${LLM_MODEL:-}
  api_key: ${LLM_API_KEY:-}
  temperature: 0.0
  max_tokens: ${LLM_MAX_TOKENS:-4096}
  timeout_s: 60
  anthropic_version: "2023-06-01"
  # Current Claude models reject `temperature` (HTTP 400); leave false for them.
  send_temperature: ${LLM_SEND_TEMPERATURE:-false}

arcadedb:
  url: ${ARCADE_URL:-}
  database: ${ARCADE_DB:-concept_graph}
  user_readonly: ${ARCADE_RO_USER:-}   # separate read-only credential — required
  password_readonly: ${ARCADE_RO_PASSWORD:-}
  timeout_s: 15
  require_readonly_user: true

qdrant:
  url: ${QDRANT_URL:-}
  api_key: ${QDRANT_API_KEY:-}
  node_collection: ${QDRANT_NODE_COLLECTION:-concepts}
  example_collection: ${QDRANT_EXAMPLE_COLLECTION:-t2c_examples}
  timeout_s: 15

mongodb:
  url: ${MONGO_URL:-}
  database: ${MONGO_DB:-}
  collection: ${MONGO_COLLECTION:-}
  enabled: false

embeddings:
  provider: ${EMBED_PROVIDER:-hashing}  # "openai" or "hashing" (offline)
  endpoint: ${EMBED_ENDPOINT:-}
  model: ${EMBED_MODEL:-}
  api_key: ${EMBED_API_KEY:-}
  dim: 256
  timeout_s: 30

grounding:
  sim_threshold: 0.55
  max_candidates: 3
  low_confidence_threshold: 0.65
  enabled: true

examples:
  top_k: 3
  sim_threshold: 0.60
  enabled: true
  seed_path: examples/seed_examples.jsonl

schema_cache:
  ttl_s: 300

dialect:
  denylist_path: config/arcade_denylist.yaml

# User-configured graph schema (node/edge kinds, statuses, attributes).
graph_config_path: ${GRAPH_CONFIG_PATH:-config/graph_config.yaml}

pipeline:
  max_attempts: 3
  hard_max_attempts: 5
  row_cap: 200
  allow_relaxation: true
